<text class="t2" x="62" y="275.33333333333337" font-size="11.5" text-anchor="end">1000</text>
<line class="grid" x1="70" x2="696" y1="178.66666666666669" y2="178.66666666666669"/>
<text class="t2" x="62" y="182.66666666666669" font-size="11.5" text-anchor="end">2000</text>
<line class="grid" x1="70" x2="696" y1="86" y2="86"/>
<text class="t2" x="62" y="90" font-size="11.5" text-anchor="end">3000</text>
<line class="axis" x1="70" x2="696" y1="364" y2="364"/>
<text class="t2" x="70" y="382" font-size="11.5" text-anchor="middle">0</text>
<text class="t2" x="278.66666666666663" y="382" font-size="11.5" text-anchor="middle">500</text>
<text class="t2" x="487.3333333333333" y="382" font-size="11.5" text-anchor="middle">1000</text>
<text class="t2" x="696" y="382" font-size="11.5" text-anchor="middle">1500</text>
<path class="s1" d="M76.7,321.3L96.7,312.2L176.8,276.6L497.3,134.3" stroke-width="2" stroke-linejoin="round"  style="fill:none"><title>WebSocket</title></path><circle class="bg" cx="76.7" cy="321.3" r="6.5"/><circle class="s1" cx="76.7" cy="321.3" r="4.5" style="stroke:none"><title>WebSocket: 461 at 16</title></circle><circle class="bg" cx="96.7" cy="312.2" r="6.5"/><circle class="s1" cx="96.7" cy="312.2" r="4.5" style="stroke:none"><title>WebSocket: 559 at 64</title></circle><circle class="bg" cx="176.8" cy="276.6" r="6.5"/><circle class="s1" cx="176.8" cy="276.6" r="4.5" style="stroke:none"><title>WebSocket: 943 at 256</title></circle><circle class="bg" cx="497.3" cy="134.3" r="6.5"/><circle class="s1" cx="497.3" cy="134.3" r="4.5" style="stroke:none"><title>WebSocket: 2479 at 1024</title></circle>
<path class="s2" d="M76.7,296.9L96.7,288.0L176.8,252.4L497.3,110.1" stroke-width="2" stroke-linejoin="round"  style="fill:none"><title>MQTT over WebSocket</title></path><circle class="bg" cx="76.7" cy="296.9" r="6.5"/><circle class="s2" cx="76.7" cy="296.9" r="4.5" style="stroke:none"><title>MQTT over WebSocket: 724 at 16</title></circle><circle class="bg" cx="96.7" cy="288.0" r="6.5"/><circle class="s2" cx="96.7" cy="288.0" r="4.5" style="stroke:none"><title>MQTT over WebSocket: 820 at 64</title></circle><circle class="bg" cx="176.8" cy="252.4" r="6.5"/><circle class="s2" cx="176.8" cy="252.4" r="4.5" style="stroke:none"><title>MQTT over WebSocket: 1204 at 256</title></circle><circle class="bg" cx="497.3" cy="110.1" r="6.5"/><circle class="s2" cx="497.3" cy="110.1" r="4.5" style="stroke:none"><title>MQTT over WebSocket: 2740 at 1024</title></circle>
<path class="s3" d="M76.7,322.6L96.7,313.7L176.8,278.1L497.3,135.8" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" style="fill:none"><title>JSON only</title></path><circle class="bg" cx="76.7" cy="322.6" r="6.5"/><circle class="s3" cx="76.7" cy="322.6" r="4.5" style="stroke:none"><title>JSON only: 447 at 16</title></circle><circle class="bg" cx="96.7" cy="313.7" r="6.5"/><circle class="s3" cx="96.7" cy="313.7" r="4.5" style="stroke:none"><title>JSON only: 543 at 64</title></circle><circle class="bg" cx="176.8" cy="278.1" r="6.5"/><circle class="s3" cx="176.8" cy="278.1" r="4.5" style="stroke:none"><title>JSON only: 927 at 256</title></circle><circle class="bg" cx="497.3" cy="135.8" r="6.5"/><circle class="s3" cx="497.3" cy="135.8" r="4.5" style="stroke:none"><title>JSON only: 2463 at 1024</title></circle>
