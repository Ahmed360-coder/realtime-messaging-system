<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Bytes on the wire per 1-to-1 message">
<title>Bytes on the wire per 1-to-1 message</title>
<style>
  .bg { fill: #fcfcfb } .t1 { fill: #0b0b0b } .t2 { fill: #52514e } .grid { stroke: #e4e3df } .axis { stroke: #8a8984 }
  .s1 { stroke: #2a78d6; fill: #2a78d6 } .s2 { stroke: #eb6834; fill: #eb6834 } .s3 { stroke: #8a8984; fill: #8a8984 }
  .whisker { stroke: #0b0b0b } .gap { stroke: #fcfcfb }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19 } .t1 { fill: #ffffff } .t2 { fill: #c3c2b7 } .grid { stroke: #34332f } .axis { stroke: #77766f }
    .s1 { stroke: #3987e5; fill: #3987e5 } .s2 { stroke: #d95926; fill: #d95926 } .s3 { stroke: #9a9992; fill: #9a9992 }
    .whisker { stroke: #ffffff } .gap { stroke: #1a1a19 }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif }</style>
<rect class="bg" width="720" height="420"/>
<text class="t1" x="70" y="26" font-size="17" font-weight="600">Bytes on the wire per 1-to-1 message</text>
<text class="t2" x="70" y="46" font-size="12.5">MSG up + ACK back + MSG down, counted by the server's TCP sockets (TCP/IP headers not included)</text>
<line class="s1" x1="70" y1="64" x2="92" y2="64" stroke-width="2.5" /><text class="t1" x="98" y="68" font-size="12.5">WebSocket</text>
<line class="s2" x1="183" y1="64" x2="205" y2="64" stroke-width="2.5" /><text class="t1" x="211" y="68" font-size="12.5">MQTT over WebSocket</text>
<line class="s3" x1="366" y1="64" x2="388" y2="64" stroke-width="2.5" stroke-dasharray="6 4"/><text class="t1" x="394" y="68" font-size="12.5">JSON only</text>
<line class="grid" x1="70" x2="696" y1="364" y2="364"/>
<text class="t2" x="62" y="368" font-size="11.5" text-anchor="end">0</text>
