<text class="t2" x="62" y="312.4" font-size="11.5" text-anchor="end">20</text>
<line class="grid" x1="70" x2="696" y1="252.8" y2="252.8"/>
<text class="t2" x="62" y="256.8" font-size="11.5" text-anchor="end">40</text>
<line class="grid" x1="70" x2="696" y1="197.20000000000002" y2="197.20000000000002"/>
<text class="t2" x="62" y="201.20000000000002" font-size="11.5" text-anchor="end">60</text>
<line class="grid" x1="70" x2="696" y1="141.6" y2="141.6"/>
<text class="t2" x="62" y="145.6" font-size="11.5" text-anchor="end">80</text>
<line class="grid" x1="70" x2="696" y1="86" y2="86"/>
<text class="t2" x="62" y="90" font-size="11.5" text-anchor="end">100</text>
<line class="axis" x1="70" x2="696" y1="364" y2="364"/>
<text class="t2" x="70" y="382" font-size="11.5" text-anchor="middle">0</text>
<text class="t2" x="226.5" y="382" font-size="11.5" text-anchor="middle">50</text>
