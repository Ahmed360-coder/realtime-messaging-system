<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Use the phone's real width (not a zoomed-out 980px desktop page). viewport-fit=cover
       lets us use the whole screen on notched phones; style.css keeps content out of the notch. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#2563eb">
  <title>Realtime Chat</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <!-- Connection banner. aria-live: screen readers announce changes ("Offline…"). -->
    <div id="banner" class="banner" role="status" aria-live="polite" hidden>
      <span id="bannerText"></span>
      <button type="button" id="bannerAction" class="banner-action" hidden>Use here</button>
    </div>

    <!-- 1. Join screen -->
    <section id="joinView" class="view join" aria-labelledby="joinTitle">
      <header class="bar">
        <h1 id="joinTitle" class="bar-title">Realtime Chat</h1>
        <button type="button" class="icon-btn debug-toggle" aria-label="Show debug panel" aria-pressed="false">{ }</button>
      </header>
      <form id="joinForm" class="join-form" novalidate>
        <p class="hint">CSEN 503 · ChatProto v1 over WebSocket or MQTT</p>
        <label for="username">Choose a username</label>
        <input id="username" name="username" maxlength="20" autocomplete="username"
               autocapitalize="off" spellcheck="false" pattern="[A-Za-z0-9_]{1,20}"
               aria-describedby="usernameHelp joinError" required>
        <p id="usernameHelp" class="hint">1–20 letters, digits or _ . The name is tied to this device.</p>
        <!-- Step 5: the same chat over either application-layer protocol (chosen per tab). -->
        <fieldset class="protocol">
          <legend>Protocol</legend>
          <label><input type="radio" name="protocol" value="ws" checked> WebSocket <span class="hint">ChatProto frames</span></label>
          <label><input type="radio" name="protocol" value="mqtt"> MQTT <span class="hint">publish / subscribe</span></label>
        </fieldset>
        <p id="joinError" class="error" role="alert"></p>
        <button id="joinBtn" class="primary">Join</button>
      </form>
    </section>

    <!-- 2. Contact list -->
    <section id="listView" class="view" aria-labelledby="listTitle" hidden>
      <header class="bar">
        <div class="bar-title">
          <h1 id="listTitle">Chats</h1>
          <span class="subtitle">signed in as <span id="meName"></span> · <span id="meProtocol"></span></span>
        </div>
        <button type="button" class="icon-btn debug-toggle" aria-label="Show debug panel" aria-pressed="false">{ }</button>
      </header>
      <ul id="contactList" class="contacts"></ul>
      <p id="noContacts" class="empty" hidden>No one else has joined yet.<br>Open this page on another phone.</p>
    </section>

    <!-- 3. One conversation -->
    <section id="chatView" class="view" aria-labelledby="chatName" hidden>
      <header class="bar">
        <button type="button" id="backBtn" class="icon-btn" aria-label="Back to chats">‹</button>
        <div class="bar-title">
          <h2 id="chatName"></h2>
          <span id="chatPresence" class="subtitle"></span>
        </div>
        <button type="button" class="icon-btn debug-toggle" aria-label="Show debug panel" aria-pressed="false">{ }</button>
      </header>
      <ol id="messageList" class="messages" aria-label="Messages"></ol>
      <form id="sendForm" class="composer">
        <label for="text" class="sr-only">Message</label>
        <input id="text" maxlength="2000" autocomplete="off" enterkeyhint="send" placeholder="Message">
        <button id="sendBtn" class="send" aria-label="Send">➤</button>
      </form>
    </section>

    <!-- Step 2/3 demo tools for the oral exam, hidden behind the { } button. -->
    <aside id="debugPanel" class="debug" aria-label="Debug panel" hidden>
      <p class="debug-stats">
        <span id="dbgConn"></span> · lastSeq <b id="dbgSeq">0</b> · waiting for ACK <b id="dbgPending">0</b>
      </p>
      <div class="debug-actions">
        <button type="button" id="dropBtn">Drop connection</button>
        <button type="button" id="dupBtn">Re-send last (same id)</button>
        <button type="button" id="clearLogBtn">Clear log</button>
      </div>
      <ol id="frames" class="frames" aria-label="Frames and MQTT packets (↑ sent, ↓ received)"></ol>
      <form id="rawForm" class="composer raw">
        <label for="raw" class="sr-only">Raw frame</label>
        <input id="raw" autocomplete="off" spellcheck="false" placeholder='Raw frame, e.g. {"v":1,"type":"NOPE"}'>
        <button>Raw</button>
      </form>
    </aside>
  </div>

  <!-- Order matters: the codec, the MQTT library + adapter, the protocol client, then the page
       state, then the UI. mqtt.min.js is served by our own server, so phones need no internet. -->
  <script src="/protocols/chatproto.js"></script>
  <script src="/protocols/mqtt-binding.js"></script>
  <script src="/vendor/mqtt.min.js"></script>
  <script src="/mqtt-socket.js"></script>
  <script src="/chat-client.js"></script>
  <script src="/conversations.js"></script>
  <script src="/app.js"></script>
</body>
</html>
